services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - qdrant
      - mongodb
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  recent-circulars:
    build:
      context: .
      dockerfile: Dockerfile.recent
    ports:
      - "8502:8502"
    env_file: .env
    restart: unless-stopped

  extraction-worker:
    build:
      context: .
      dockerfile: Dockerfile.recent
    env_file: .env
    entrypoint: ["sh", "-c", "while true; do python scripts/extract_recent.py --batch-size 10; sleep 21600; done"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
  caddy_data:
